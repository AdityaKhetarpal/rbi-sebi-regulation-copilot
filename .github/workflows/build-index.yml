# Every Monday (or on demand): download the current RBI Master Directions, rebuild the search index,
# re-run the evaluation, test the website on the real data, and commit the results only if the scores stay high.
name: Build index

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # Monday 08:30 India time

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # CPU-only PyTorch keeps the install small; the models run fine on CPU for a few hundred pages
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('copilot/config.py') }}

      - name: Download, chunk and embed
        run: python scripts/build_index.py

      # quality gate: if RBI's page changes and a wrong PDF is picked up, scores drop and nothing is committed
      - name: Evaluate the full pipeline
        run: python scripts/run_eval.py --min-accuracy 90
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: without it the extractive engine is scored

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test the website on the real documents (second quality gate)
        working-directory: web
        run: npm ci && npm test

      - name: Commit the new index
        run: |
          git config user.name "Aditya Khetarpal"
          git config user.email "80028073+AdityaKhetarpal@users.noreply.github.com"
          git add data/index data/eval/report.json web/public/data
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Rebuild index $(date -u +%Y-%m-%d)"
          git push
