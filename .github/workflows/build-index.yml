# Every Monday (or on demand): download the current RBI Master Directions, rebuild the search index,
# re-test it, check the website on the real data, and commit the results only if the scores stay high.
name: Build index

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # Monday 08:30 India time

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # CPU-only PyTorch keeps the install small; the models run fine on CPU for a few hundred pages
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('pipeline/settings.py') }}

      # steps 1-4 and 7; stops (and publishes nothing) if any test score is below 90%
      - name: Build and test (pipeline/build_all.py)
        run: python pipeline/build_all.py --min-score 90

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test the website on the real documents (second quality gate)
        working-directory: web
        run: npm ci && npm test

      - name: Commit the new index
        run: |
          git config user.name "Aditya Khetarpal"
          git config user.email "80028073+AdityaKhetarpal@users.noreply.github.com"
          git add data/downloads.json data/pages.csv data/chunks.csv data/vectors.npy data/test_report.json web/public/data
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Rebuild index $(date -u +%Y-%m-%d)"
          git push
